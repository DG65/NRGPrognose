<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <style>
        html, body { margin: 0; height: 100%; background: transparent; }
        .wrap { box-sizing: border-box; padding: 56px 6px 10px; position: relative; }
        #legend { display: none; text-align: right; margin-bottom: 8px; line-height: 1.3; }
        #legend .lg { display: inline-flex; align-items: center; gap: 6px; margin-left: 16px; cursor: pointer; white-space: nowrap; }
        #legend .lg:first-child { margin-left: 0; }
        #legend .sw { width: 11px; height: 11px; border-radius: 2px; display: inline-block; }
        #legend .lg b { font-weight: 500; }
        /* Mehr als 3 Tage: Chart+Tagesstreifen werden breiter als der Rahmen und per
           nativem Browser-Scroll gezeigt (statt sich zusammenzuquetschen) — beide bleiben
           dabei pixelgenau ausgerichtet, weil sie dieselbe berechnete Breite bekommen.
           Scrollbalken bewusst unsichtbar (Dietmars Wunsch — überdeckte sonst die
           Ist-Werte-Zeile am unteren Rand); gescrollt wird trotzdem ganz normal per
           Touch/Trackpad/Klick-Ziehen, nur ohne sichtbare Leiste. */
        #scrollWrap { overflow-x: auto; overflow-y: hidden; scrollbar-width: none; -ms-overflow-style: none; position: relative; }
        #scrollWrap::-webkit-scrollbar { display: none; height: 0; }
        /* Y-Achse (kW) bleibt beim Horizontalscrollen sichtbar: eigene, schmale
           Überlagerung mit position:sticky links im Scroll-Rahmen — dafür blenden
           beide Engines ihre EIGENE Achsenbeschriftung aus (Gitterlinien bleiben).
           width/height:0 + overflow:visible, damit sie keinen Platz im Layout
           beansprucht, ihre Kind-Elemente aber trotzdem absolut positionierbar sind. */
        #yAxisOverlay { position: sticky; left: 0; top: 0; width: 0; height: 0; overflow: visible; z-index: 5; pointer-events: none; }
        #yAxisOverlay .yl { position: absolute; left: 2px; transform: translateY(-50%); white-space: nowrap; }
        /* Scroll-Hinweis (Forum-Feedback hfichtinger, 26.08.2026: "war etwas
           tricky das scrollen herauszufinden") — je ein Pfeil links/rechts,
           als kleine runde "Chip"-Fläche (Hintergrund/Textfarbe dynamisch aus
           D.TIP/D.TEXT gesetzt, siehe updateScrollHint) statt reinem Zeichen,
           damit er auf JEDEM Kachel-Hintergrund (hell/dunkel/transparent)
           sicher lesbar ist — die erste Fassung (nur Text + Schatten) war auf
           dunklem Grund kaum zu erkennen (Dietmars Feedback). BEWUSST
           außerhalb von #scrollWrap, als Geschwister-Elemente direkt in .wrap
           (die selbst nicht scrollt): position:sticky innerhalb des Scroll-
           Rahmens (wie bei #yAxisOverlay) funktioniert hier NICHT symmetrisch —
           die statische Ausgangsposition eines Blocks mit width:0 liegt immer
           am LINKEN Rand des Inhalts, „right:0" hätte also nie etwas zum
           Andocken (live geprüft: Pfeil blieb bei x≈0 hängen statt rechts).
           Stattdessen: position:absolute relativ zu .wrap, vertikale Position
           wird in updateScrollHint() aus der tatsächlichen Chart-Höhe berechnet
           (die variiert je nach Konfiguration). Links nur eingeblendet, wenn
           bereits nach rechts gescrollt wurde, rechts nur, solange noch mehr
           Inhalt folgt — kein dauerhaftes Element, keine erneute sichtbare
           Bildlaufleiste (die wollte Dietmar bewusst nicht mehr). */
        #scrollHintL, #scrollHintR { position: absolute; width: 0; height: 0; overflow: visible; z-index: 6; pointer-events: none; }
        /* #scrollHintL.left wird per JS gesetzt (aus D.plotLeft, siehe
           updateScrollHint) — ein fester Wert läge über der Y-Achsen-
           Beschriftung (Dietmars Feedback: der linke Pfeil deckte die
           mittlere Y-Achsen-Zahl ab). #scrollHintR.right bleibt fest, dort
           gibt es keine Beschriftung im Weg. */
        #scrollHintR { right: 6px; }
        #scrollHintL span, #scrollHintR span {
            position: absolute; top: 0; transform: translateY(-50%);
            display: flex; align-items: center; justify-content: center;
            width: 26px; height: 26px; border-radius: 50%;
            font-size: 17px; line-height: 1; opacity: 0; transition: opacity .2s;
            box-shadow: 0 1px 5px rgba(0,0,0,.3);
        }
        #scrollHintL span { left: 0; }
        #scrollHintR span { right: 0; }
        #scrollHintL span.show, #scrollHintR span.show { opacity: .92; }
        #chart { width: 100%; height: 360px; }
        /* Hinweis der Balkenansicht, wenn die Prognose gröber als 15 min vorliegt */
        /* Abkündigungshinweis (Build 149): eigene Zeile über der Legende, kein
           Overlay über dem Diagramm; keine Animation. Farben kommen per JS aus
           den Kachel-Farben (hell/dunkel/Beschriftung), hier nur das Gerüst. */
        #retireNote { display: none; align-items: flex-start; gap: 8px; box-sizing: border-box; margin: 0 0 6px; padding: 5px 8px; border-radius: 6px; font-size: 11px; line-height: 1.35; border: 1px solid rgba(127,127,127,.35); background: rgba(127,127,127,.12); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        #retireNote .rt { flex: 1 1 auto; }
        #retireNote button { flex: 0 0 auto; font: inherit; cursor: pointer; padding: 1px 8px; border-radius: 4px; border: 1px solid rgba(127,127,127,.55); background: transparent; color: inherit; }
        #viewHint { display: none; font-size: 11px; line-height: 1.3; margin: 2px 0 4px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        /* +5px Abstand zur X-Achsen-Zeitbeschriftung des Charts direkt darüber
           (Dietmars Feedback: zu eng, dadurch waren die Uhrzeiten schlecht
           von "Gestern"/"Heute" usw. zu unterscheiden). */
        #days { display: none; margin-top: 11px; line-height: 1.25; }
        .empty { color: #8a97a3; font-size: 13px; padding: 24px 10px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
</head>

<body>
    <div class="wrap">
        <div id="retireNote"><span class="rt"></span><button type="button" id="retireOk" onclick="retireDismiss()">Verstanden</button></div>
        <div id="legend"></div>
        <div id="viewHint"></div>
        <div id="scrollWrap">
            <div id="yAxisOverlay"></div>
            <div id="chart"></div>
            <div id="days"></div>
        </div>
        <div id="scrollHintL"><span>&lsaquo;</span></div>
        <div id="scrollHintR"><span>&rsaquo;</span></div>
    </div>

    <script>
        var lastData = null, chart = null, chartEngine = null;
        var userHide = { pv: false, load: false, pvm: false, lom: false };
        var libs = { hc: 0, ec: 0 };
        // Gestrichelte "jetzt"-Linie rot statt neutralem Grau (Dietmars Wunsch) —
        // fest statt theme-abhängig, da Rot auf hellem wie dunklem Grund gut lesbar bleibt.
        var NOW_LINE_COLOR = '#ef4444';
        // Plotbereich-Ränder — für BEIDE Engines identisch erzwungen (statt deren
        // Auto-Layout), damit die feststehende Y-Achsen-Überlagerung (buildYAxisOverlay)
        // unabhängig von der Engine an derselben Pixel-Position sitzt wie die echten
        // Gitterlinien, und damit der Tagesstreifen (padding-Werte) weiter fluchtet.
        // Mit der Kachel-Schriftgröße (D.scale) skaliert — sonst passen bei größer
        // skalierten Kacheln weder die X-Achsen-Beschriftung (unten) noch die
        // „kW"-Einheit (oben) mehr in den fest reservierten Rand und werden
        // abgeschnitten (live bei Dietmar mit skalierter Kachel aufgetreten).
        function plotMetrics(scale) {
            return {
                left: Math.round(46 * scale), right: Math.round(14 * scale),
                top: Math.round(18 * scale), bottom: Math.round(28 * scale)
            };
        }

        function retireKey(rn) { return 'eftile.retire.' + (rn.instance || 0) + '.' + (rn.version || '1'); }
        function retireDismissed(rn) {
            try { return window.localStorage.getItem(retireKey(rn)) === '1'; } catch (e) { return false; }
        }
        function applyRetireNote(data, color) {
            var n = document.getElementById('retireNote'); if (!n) { return; }
            var rn = data.retireNotice;
            if (!rn || !rn.text || retireDismissed(rn)) { n.style.display = 'none'; return; }
            n.style.display = 'flex'; n.style.color = color || '';
            n.querySelector('.rt').textContent = rn.text;
        }
        function retireDismiss() {
            var rn = lastData && lastData.retireNotice; if (!rn) { return; }
            try { window.localStorage.setItem(retireKey(rn), '1'); } catch (e) { /* ohne Speicher: erscheint beim nächsten Laden wieder */ }
            document.getElementById('retireNote').style.display = 'none';
            render();
        }

        function handleMessage(payload) {
            var data = (typeof payload === 'string') ? JSON.parse(payload) : payload;
            if (!data) { return; }
            lastData = data;
            // Hintergrundfarbe gilt für die GANZE Kachel/Seite, nicht nur das Diagramm.
            document.body.style.background = data.bg ? data.bg : 'transparent';
            document.documentElement.style.background = data.bg ? data.bg : 'transparent';
            render();
        }

        function pad(x) { return (x < 10 ? '0' : '') + x; }
        function kw(w) { return (w / 1000).toFixed(2); }
        function cap(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }

        /** Nächstliegenden Unsicherheitsband-Punkt ([x,p10,p90] in kW) zu x suchen —
         *  für die P10/P90-Anzeige im Tooltip (beide Engines, siehe buildEC/buildHC). */
        function nearestBand(bandArr, x) {
            if (!bandArr || !bandArr.length) { return null; }
            var best = bandArr[0], bd = Math.abs(bandArr[0][0] - x);
            for (var i = 1; i < bandArr.length; i++) {
                var d = Math.abs(bandArr[i][0] - x);
                if (d < bd) { bd = d; best = bandArr[i]; }
            }
            return best;
        }

        /** Textfarben nach Helligkeit des konfigurierten Hintergrunds wählen. */
        function isDarkColor(hex) {
            var m = /^#?([0-9a-f]{6})$/i.exec(hex || '');
            if (!m) { return null; }
            var n = parseInt(m[1], 16);
            var lum = 0.299 * ((n >> 16) & 255) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255);
            return lum < 140;
        }

        function addScript(src, cb) {
            var s = document.createElement('script');
            s.src = src; s.onload = cb; s.onerror = function () { cb && cb(); };
            document.head.appendChild(s);
        }
        function ensureLib(engine, cb) {
            if (engine === 'echarts') {
                if (typeof echarts !== 'undefined') { libs.ec = 2; return cb(); }
                if (libs.ec === 1) { return setTimeout(function () { ensureLib(engine, cb); }, 80); }
                libs.ec = 1; addScript('https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js', function () { libs.ec = 2; cb(); });
            } else {
                if (typeof Highcharts !== 'undefined' && Highcharts.seriesTypes && Highcharts.seriesTypes.arearange) { libs.hc = 2; return cb(); }
                if (libs.hc === 1) { return setTimeout(function () { ensureLib(engine, cb); }, 80); }
                libs.hc = 1; addScript('https://code.highcharts.com/highcharts.js', function () { addScript('https://code.highcharts.com/highcharts-more.js', function () { libs.hc = 2; cb(); }); });
            }
        }

        function destroyChart() {
            if (chart) { try { if (chartEngine === 'highcharts') { chart.destroy(); } else { chart.dispose(); } } catch (e) {} }
            chart = null; chartEngine = null;
            var c = document.getElementById('chart'); if (c) { c.innerHTML = ''; }
        }

        var scrollHintBound = false, lastHintD = null;
        /**
         * Pfeile links/rechts nur zeigen, solange in die jeweilige Richtung
         * noch mehr Inhalt folgt. #scrollHintL/R sitzen außerhalb von
         * #scrollWrap (siehe CSS-Kommentar), deshalb wird ihre vertikale
         * Position hier aus der tatsächlichen Chart-Höhe berechnet (variiert
         * je nach Konfiguration/Ist-Zeile). $D optional (fehlt beim reinen
         * Scroll-Update) — Farben werden dann einfach nicht neu gesetzt.
         */
        function updateScrollHint(D) {
            if (D) { lastHintD = D; }
            var w = document.getElementById('scrollWrap');
            var hintL = document.getElementById('scrollHintL'), hintR = document.getElementById('scrollHintR');
            var spanL = hintL ? hintL.querySelector('span') : null, spanR = hintR ? hintR.querySelector('span') : null;
            var chartEl = document.getElementById('chart');
            var wrapEl = document.querySelector('.wrap');
            if (!w || !hintL || !hintR || !spanL || !spanR || !chartEl || !wrapEl) { return; }
            var scrollable = w.scrollWidth > w.clientWidth + 1;
            var atStart = w.scrollLeft <= 2;
            var atEnd = w.scrollLeft + w.clientWidth >= w.scrollWidth - 2;
            spanL.classList.toggle('show', scrollable && !atStart);
            spanR.classList.toggle('show', scrollable && !atEnd);
            if (lastHintD) {
                [spanL, spanR].forEach(function (s) { s.style.background = lastHintD.TIP; s.style.color = lastHintD.TEXT; });
                // Links hinter die Y-Achsen-Beschriftung setzen (D.plotLeft) statt
                // eines festen Werts — sonst deckt der Pfeil die mittlere
                // Y-Achsen-Zahl ab (Dietmars Feedback).
                hintL.style.left = (lastHintD.plotLeft + 6) + 'px';
            }
            var cRect = chartEl.getBoundingClientRect(), wRect = wrapEl.getBoundingClientRect();
            var top = Math.round(cRect.top - wRect.top + cRect.height / 2) + 'px';
            hintL.style.top = top; hintR.style.top = top;
            if (!scrollHintBound) { scrollHintBound = true; w.addEventListener('scroll', function () { updateScrollHint(); }); }
        }

        function render() {
            var data = lastData; if (!data) { return; }
            var engine = (data.engine === 'highcharts') ? 'highcharts' : 'echarts';
            var el = document.getElementById('chart');
            var legEl = document.getElementById('legend'), daysEl = document.getElementById('days');
            // Tagesbalken (Build 155): eigene Ansicht ohne Diagramm-Bibliothek, der Tagesstreifen entfällt dabei (sein CSS-Abstand ebenso)
            var dayMode = (data.view === 'days');
            daysEl.style.marginTop = dayMode ? '0' : '';
            if (!data.hasData || !data.days || !data.days.length) {
                destroyChart();
                legEl.style.display = 'none'; daysEl.style.display = 'none';
                applyRetireNote(data, '');
                el.innerHTML = '<div class="empty">' + (data.message || 'Keine Daten') + '</div>';
                updateScrollHint();
                return;
            }
            if (dayMode) { destroyChart(); buildDayBars(); return; }
            ensureLib(engine, function () {
                if (chart && chartEngine !== engine) { destroyChart(); }
                chartEngine = engine;
                if (engine === 'echarts') { buildEC(); } else { buildHC(); }
            });
        }

        // ---- gemeinsame Datenaufbereitung -------------------------------
        function prepData() {
            var data = lastData;
            // Mit konfiguriertem Hintergrund entscheidet dessen Helligkeit über die
            // Textfarben; ohne (transparent) der Hell-/Dunkelmodus des Geräts.
            var bgDark = isDarkColor(data.bg);
            var dark = (bgDark !== null) ? bgDark
                     : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
            // Eigene Wahl der Schriftfarbe (Forum lungo #62): 1 = hell (dunkle Kachel), 2 = dunkel (helle Kachel) überstimmt
            // die Erkennung - nötig, wenn das WebFront-Theme nicht zum Betriebssystem/Browser passt.
            if (data.labelTone === 1) { dark = true; } else if (data.labelTone === 2) { dark = false; }
            // Breite: bis zu BASELINE_DAYS passt wie bisher ohne Scroll in den Rahmen;
            // darüber hinaus wird Chart+Tagesstreifen proportional breiter und der
            // Rahmen (#scrollWrap, overflow-x:auto) macht daraus horizontales Scrollen —
            // beide bekommen dieselbe Breite, damit Tagesgrenzen exakt fluchten.
            var wrapEl = document.getElementById('scrollWrap');
            var baseW = (wrapEl && wrapEl.clientWidth) ? wrapEl.clientWidth : (document.body.clientWidth || 600);
            var BASELINE_DAYS = 3;
            var renderW = Math.round(Math.max(baseW, baseW * data.days.length / BASELINE_DAYS));
            var scale = data.scale || 1, pm = plotMetrics(scale);
            var D = {
                data: data,
                renderW: renderW,
                dark: dark, TEXT: dark ? '#e8edf2' : '#1b2430', MUTED: dark ? '#c4cfda' : '#5c6b7a',
                GRID: dark ? 'rgba(127,135,145,.22)' : 'rgba(20,30,45,.14)', TIP: dark ? 'rgba(28,38,52,.97)' : 'rgba(255,255,255,.98)',
                SEP: dark ? 'rgba(159,176,192,.34)' : 'rgba(92,107,122,.30)',
                days: data.days, nDays: data.days.length,
                pvC: data.pvColor || '#e0a020', loC: data.loadColor || '#2bb3c0',
                pvMC: data.actualPvColor || data.pvColor || '#e0a020', loMC: data.actualLoadColor || data.loadColor || '#2bb3c0',
                plotLeft: pm.left, plotRight: pm.right, plotTop: pm.top, plotBottom: pm.bottom,
                scale: scale, lw: data.lineWidth || 2, smooth: (data.smooth !== false),
                showBand: (data.showBand !== false), bandOp: (data.bandOp != null ? data.bandOp : 0.16),
                actualPV: data.actualPV, actualLoad: data.actualLoad,
                yMaxManual: data.yMaxManual || 0, showGrid: (data.showGrid !== false), showLegend: (data.showLegend !== false),
                showIstRow: (data.showIstRow !== false), font: data.font || 'sans-serif',
                bars: (data.view === 'bars'), coarseMin: 0, stH: 0.25,
                maxKwp: (data.showMaxLine && data.maxKwp > 0) ? data.maxKwp : 0, maxLabel: (data.maxManual ? 'Max. ' : 'Anlage '), maxUnit: (data.maxManual ? ' kW' : ' kWp'), showViewHint: (data.showViewHint !== false),
                pvBars: [], loBars: [], pvMBars: [],
                pvPresent: false, loPresent: false, pvLine: [], pvBand: [], loLine: [], loBand: []
            };
            // Balkenansicht: Punkte in die Mitte der Zeitscheibe legen (Balken zentriert, Linien deckungsgleich);
            // gröbste vorkommende Auflösung merken für den Hinweis.
            data.days.forEach(function (d, di) {
                if (d.pv) {
                    D.pvPresent = true; var n = d.pv.p50.length, st = 24 / n, off = D.bars ? st / 2 : 0;
                    if (n < 96) { D.coarseMin = Math.max(D.coarseMin, Math.round(1440 / n)); }
                    D.stH = st;
                    for (var i = 0; i < n; i++) {
                        var x = di * 24 + i * st + off; D.pvLine.push([x, d.pv.p50[i] / 1000]); D.pvBand.push([x, d.pv.p10[i] / 1000, d.pv.p90[i] / 1000]);
                        D.pvBars.push([di * 24 + i * st, di * 24 + (i + 1) * st, d.pv.p50[i] / 1000]);
                    }
                }
                if (d.load) {
                    D.loPresent = true; var n2 = d.load.p50.length, st2 = 24 / n2, off2 = D.bars ? st2 / 2 : 0;
                    if (n2 < 96) { D.coarseMin = Math.max(D.coarseMin, Math.round(1440 / n2)); }
                    D.stH = Math.min(D.stH, st2);
                    for (var j = 0; j < n2; j++) { var x2 = di * 24 + j * st2 + off2; D.loLine.push([x2, d.load.p50[j] / 1000]); D.loBand.push([x2, d.load.p10[j] / 1000, d.load.p90[j] / 1000]); }
                }
            });
            // Ist-Verlauf je Tag (Gestern voller Tag, Heute bis jetzt) — über die Segmente verteilt.
            D.pvMeas = []; D.loMeas = [];
            data.days.forEach(function (d, di) {
                if (d.pvMeas) {
                    var n = d.pvMeas.length, st = 24 / n, off = D.bars ? st / 2 : 0;
                    for (var i = 0; i < n; i++) { if (d.pvMeas[i] != null) { D.pvMeas.push([di * 24 + i * st + off, d.pvMeas[i] / 1000]); D.pvMBars.push([di * 24 + i * st, di * 24 + (i + 1) * st, d.pvMeas[i] / 1000]); } }
                }
                if (d.loMeas) { var n2 = d.loMeas.length, st2 = 24 / n2, off2 = D.bars ? st2 / 2 : 0; for (var j = 0; j < n2; j++) { if (d.loMeas[j] != null) { D.loMeas.push([di * 24 + j * st2 + off2, d.loMeas[j] / 1000]); } } }
            });
            D.hasIst = data.days.some(function (d) { return d.pvKwhIst != null || d.loKwhIst != null; });

            // Sichtbarkeit je Reihe (Legenden-Klick) + Y-Achsen-Max — geteilt zwischen
            // beiden Engines, damit die feststehende Y-Achsen-Überlagerung (siehe
            // buildYAxisOverlay) exakt zu dem passt, was jede Engine tatsächlich zeichnet.
            D.pvVis = D.pvPresent && !userHide.pv;
            // gemessene Linien lassen sich getrennt von der Prognose ausblenden (Forum Ghostraider, 10.10.2026)
            D.pvMVis = D.pvMeas.length > 1 && !userHide.pvm;
            D.loMVis = D.loMeas.length > 1 && !userHide.lom;
            D.loVis = D.loPresent && !userHide.load;
            (function () {
                var maxV = 0, useBand = D.showBand && D.bandOp > 0 && !D.bars;
                if (D.pvVis) { (useBand ? D.pvBand : D.pvLine).forEach(function (p) { var v = useBand ? p[2] : p[1]; if (v > maxV) { maxV = v; } }); }
                if (D.loVis) { (useBand ? D.loBand : D.loLine).forEach(function (p) { var v = useBand ? p[2] : p[1]; if (v > maxV) { maxV = v; } }); }
                // Balken: auch die gemessenen Werte können über der Prognose liegen
                if (D.bars) { D.pvMBars.forEach(function (b) { if (b[2] > maxV) { maxV = b[2]; } }); D.loMeas.forEach(function (p) { if (p[1] > maxV) { maxV = p[1]; } }); }
                // Anlagenleistung als Linie: die Y-Achse reicht bis knapp darüber, damit sie sichtbar ist
                if (D.maxKwp > 0 && D.maxKwp > maxV) { maxV = D.maxKwp; }
                D.yMax = D.yMaxManual > 0 ? D.yMaxManual : Math.max(0.5, Math.ceil(maxV * 1.08 * 2) / 2);
            })();
            // Abkündigungshinweis (Build 149): Text/Version kommen aus module.php; "Verstanden"
            // merkt sich die Kachel je Instanz und Hinweisversion im Browser (ohne localStorage
            // erscheint er bei jedem Laden). Eigene Zeile oberhalb, verdeckt das Diagramm nicht.
            applyRetireNote(data, D.TEXT);
            // Hinweis, wenn die Prognose gröber als 15 min vorliegt (nur Balkenansicht)
            (function () {
                var h = document.getElementById('viewHint'); if (!h) { return; }
                if (D.bars && D.coarseMin > 0 && D.showViewHint) {
                    h.style.display = 'block'; h.style.color = D.TEXT;
                    h.textContent = 'Balken: Die Prognose liegt in ' + D.coarseMin + ' min Auflösung vor - für 15-Minuten-Balken in PV- und Lastprognose die zeitliche Auflösung auf 15 min stellen.';
                } else { h.style.display = 'none'; h.textContent = ''; }
            })();

            // „jetzt"-Marker am Heute-Segment (mit Gestern verschiebt es sich um 24 h).
            // Die konkreten Punkte (Farbe/Sichtbarkeit) baut sich jede Engine selbst aus
            // D.nowX/D.actualPV/D.actualLoad + der aktuellen userHide-Sichtbarkeit.
            D.nowX = null;
            var heuteIdx = -1;
            data.days.forEach(function (d, di) { if (d.label === 'heute') { heuteIdx = di; } });
            if (heuteIdx >= 0) {
                // Anteil des bereits vergangenen Tages statt roher Wanduhr-Stunde
                // (Verbundweite DST-Prüfung, Dashboard, 26.08.2026): an den zwei

        // ---- Legende (geteilt zwischen beiden Engines) -------------------

        function dayStrip(daysEl, D) {

            var canvasH = computeCanvasHeight(legEl, daysEl);

            var h = '<div style="position:relative;height:' + canvasH + 'px;font-size:' + fs + 'px;font-family:' + D.font + ';color:' + D.TEXT + '">';
            for (var v = 0; v <= yMax + 1e-9; v += step) {

            function bar(name, color, soll, ist) {
                var bh = Math.max(soll > 0 ? 2 : 0, plotH * soll / yMax), ih = (ist != null) ? Math.min(bh, plotH * ist / yMax) : 0;
                var tip = name + ' Soll ' + fmtKwh2(soll) + ' kWh' + (ist != null ? ', Ist ' + fmtKwh2(ist) + ' kWh' : '');
                return '<div title="' + tip + '" style="flex:0 1 38%;max-width:' + Math.round(70 * D.scale) + 'px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%">'
                    + '<div style="font-weight:600;margin-bottom:2px;white-space:nowrap">' + fmtKwh(soll) + '</div>'
                    + '<div style="position:relative;width:100%;height:' + bh.toFixed(1) + 'px">'
                    + '<div style="position:absolute;left:0;right:0;top:0;bottom:0;background:' + color + ';opacity:' + (ist != null ? 0.38 : 0.9) + ';border-radius:3px 3px 0 0"></div>'
                    + (ih > 0 ? '<div style="position:absolute;left:0;right:0;bottom:0;height:' + ih.toFixed(1) + 'px;background:' + color + ';border-radius:' + (ih >= bh - 0.5 ? '3px 3px 0 0' : '0') + '"></div>' : '')
                    + '</div></div>';
            }
            D.days.forEach(function (d) {
                var lab = String(d.label || '').split(' ('), main = cap(lab[0]), sub = lab.length > 1 ? '(' + lab.slice(1).join(' (') : '';
                var pv = (pvOn && d.pv) ? d.pv : null, lo = (loOn && d.load) ? d.load : null;
                var ipv = (pv && showIst) ? d.pvKwhIst : null, ilo = (lo && showIst) ? d.loKwhIst : null;
                h += '<div style="flex:1;position:relative;min-width:0">'
                  + '<div style="position:absolute;left:0;right:0;top:0;height:' + baseY + 'px;display:flex;align-items:flex-end;justify-content:center;gap:' + Math.round(6 * D.scale) + 'px">'
                  + (pv ? bar('PV', D.pvC, pv.kwh || 0, ipv) : '') + (lo ? bar('Verbrauch', D.loC, lo.kwh || 0, ilo) : '')
                  + '</div>'
                  + '<div style="position:absolute;left:0;right:0;top:' + (baseY + 5) + 'px;text-align:center;line-height:1.3">'
                  + '<div style="font-weight:500">' + main + '</div>'
                  + (sub ? '<div style="color:' + D.MUTED + ';font-size:0.86em">' + sub + '</div>' : '');
                if (ipv != null || ilo != null) {
                    h += '<div style="color:' + D.MUTED + ';font-size:0.86em">Ist ' + (ipv != null ? '<span style="color:' + D.pvC + '">' + fmtKwh(ipv) + '</span>' : '') + (ipv != null && ilo != null ? ' · ' : '')
                      + (ilo != null ? '<span style="color:' + D.loC + '">' + fmtKwh(ilo) + '</span>' : '') + ' kWh</div>';
                }
                h += '</div></div>';
            });
            el.innerHTML = h + '</div></div>';
            updateScrollHint(D);
        }

        function buildEC() {
            var D = prepData(), el = document.getElementById('chart');
            var legEl = document.getElementById('legend'), daysEl = document.getElementById('days');
            if (D.showLegend) { legEl.style.display = 'block'; renderLegend(legEl, D); } else { legEl.style.display = 'none'; legEl.innerHTML = ''; }
            daysEl.style.display = 'block'; dayStrip(daysEl, D);
            var canvasH = computeCanvasHeight(legEl, daysEl);
            buildYAxisOverlay(D, canvasH);
            el.style.height = canvasH + 'px'; el.style.width = D.renderW + 'px';

            var pvVis = D.pvVis, loVis = D.loVis;
            var fs = function (n) { return n * D.scale; };
            var series = [];

            // Unsicherheitsband als Polygon (robust auf der Wert-Achse)
            function bandSeries(band, color, vis) {
                if (!vis || !D.showBand || D.bandOp <= 0 || band.length < 2) { return; }
                series.push({
                    type: 'custom', silent: true, z: 1, clip: true, animation: false, data: [0],
                    renderItem: function (params, api) {
                        var pts = [], i, c;
                        for (i = 0; i < band.length; i++) { c = api.coord([band[i][0], band[i][2]]); pts.push([c[0], c[1]]); }
                        for (i = band.length - 1; i >= 0; i--) { c = api.coord([band[i][0], band[i][1]]); pts.push([c[0], c[1]]); }
                        return { type: 'polygon', shape: { points: pts }, style: { fill: color, opacity: D.bandOp } };
                    }
                });
            }
            if (!D.bars) {
                bandSeries(D.pvBand, D.pvC, pvVis);
                bandSeries(D.loBand, D.loC, loVis);
            }
            // Balken je Zeitscheibe: Rechtecke über die volle Slot-Breite (custom-Serie, robust auf der Wert-Achse);
            // inset = Anteil je Seite, der freibleibt (schmalerer Ist-Balken vor dem Soll-Balken).
            function rectSeries(bars, color, opacity, inset, z) {
                if (!bars.length) { return; }
                series.push({
                    type: 'custom', silent: true, z: z, clip: true, animation: false, data: [0],
                    renderItem: function (params, api) {
                        var els = [], i, b, p0, p1, w, pad, h;
                        for (i = 0; i < bars.length; i++) {
                            b = bars[i]; p0 = api.coord([b[0], 0]); p1 = api.coord([b[1], b[2]]);
                            w = p1[0] - p0[0]; pad = Math.max(0, w * inset); h = p0[1] - p1[1];
                            if (h <= 0) { continue; }
                            els.push({ type: 'rect', shape: { x: p0[0] + pad, y: p1[1], width: Math.max(0.5, w - 2 * pad), height: h }, style: { fill: color, opacity: opacity } });
                        }
                        return { type: 'group', children: els };
                    }
                });
            }
            if (D.bars) {
                if (pvVis) {
                    rectSeries(D.pvBars, D.pvC, 0.38, 0.04, 1);
                    // unsichtbare Linie nur für den Tooltip (Achsen-Tooltip braucht Linien-/Punktdaten)
                    series.push({ id: 'pv', name: 'PV', type: 'line', data: D.pvLine, symbol: 'none', lineStyle: { opacity: 0 }, itemStyle: { opacity: 0 }, z: 1, animation: false });
                }
                if (D.pvMVis) {
                    rectSeries(D.pvMBars, D.pvMC, 0.95, 0.2, 2);
                    series.push({ name: 'PV Ist', type: 'line', data: D.pvMeas, symbol: 'none', lineStyle: { opacity: 0 }, itemStyle: { opacity: 0 }, z: 1, animation: false });
                }
            }

            if (D.pvMVis && !D.bars) { series.push({ type: 'line', data: D.pvMeas, symbol: 'none', smooth: D.smooth, lineStyle: { color: D.pvMC, width: Math.max(1, D.lw - 0.5), type: 'dashed' }, silent: true, animation: false, z: 3 }); }
            if (D.loMVis) { series.push({ name: D.bars ? 'Verbrauch Ist' : undefined, type: 'line', data: D.loMeas, symbol: 'none', smooth: D.smooth && !D.bars, lineStyle: { color: D.loMC, width: Math.max(1, D.lw - 0.5), type: 'dashed' }, silent: true, animation: false, z: 3 }); }

            var markData = [];
            for (var di = 1; di < D.nDays; di++) { markData.push({ xAxis: di * 24, lineStyle: { color: D.SEP, type: 'solid', width: 1 } }); }
            if (D.nowX != null) { markData.push({ xAxis: D.nowX, lineStyle: { color: NOW_LINE_COLOR, type: 'dashed', width: 1 } }); }
            var markLine = { silent: true, symbol: 'none', label: { show: false }, data: markData, animation: false };
            var attached = false;
            if (pvVis && !D.bars) { var sp = { id: 'pv', name: 'PV', type: 'line', data: D.pvLine, symbol: 'none', smooth: D.smooth, lineStyle: { color: D.pvC, width: D.lw }, itemStyle: { color: D.pvC }, z: 3, animation: false }; if (!attached) { sp.markLine = markLine; attached = true; } series.push(sp); }
            if (loVis) { var sl = { id: 'load', name: 'Verbrauch', type: 'line', data: D.loLine, symbol: 'none', smooth: D.smooth, lineStyle: { color: D.loC, width: D.lw }, itemStyle: { color: D.loC }, z: 3, animation: false }; if (!attached) { sl.markLine = markLine; attached = true; } series.push(sl); }
            if (!attached && markData.length) { series.push({ type: 'line', data: [], silent: true, markLine: markLine }); }

            if (D.maxKwp > 0) {
                series.push({ type: 'line', data: [], silent: true, animation: false, markLine: { silent: true, symbol: 'none', animation: false,
                    lineStyle: { color: D.MUTED, type: 'dashed', width: 1.5 },
                    label: { show: true, position: 'insideStartTop', color: D.MUTED, fontSize: fs(10), formatter: D.maxLabel + D.maxKwp.toFixed(2) + D.maxUnit },
                    data: [{ yAxis: D.maxKwp }] } });
            }
            var dots = [];
            if (D.nowX != null) {
                if (pvVis && D.actualPV != null) { dots.push({ value: [D.nowX, D.actualPV / 1000], itemStyle: { color: (D.pvMeas.length > 1 ? D.pvMC : D.pvC), borderColor: D.TIP, borderWidth: 2 } }); }
                if (loVis && D.actualLoad != null) { dots.push({ value: [D.nowX, D.actualLoad / 1000], itemStyle: { color: (D.loMeas.length > 1 ? D.loMC : D.loC), borderColor: D.TIP, borderWidth: 2 } }); }
            }
            if (dots.length) { series.push({ type: 'scatter', data: dots, symbolSize: 11, z: 6, silent: true, animation: false }); }

            var option = {
                backgroundColor: 'transparent',
                textStyle: { fontFamily: D.font, color: D.TEXT },
                grid: { left: D.plotLeft, right: D.plotRight, top: D.plotTop, bottom: D.plotBottom, containLabel: false },
                animation: false,
                xAxis: { type: 'value', min: 0, max: D.nDays * 24, interval: 3, axisLabel: { show: true, color: D.MUTED, fontSize: fs(9), hideOverlap: true, formatter: function (v) { return pad(v % 24); } }, axisTick: { show: false }, axisLine: { lineStyle: { color: D.GRID } }, splitLine: { show: D.showGrid, lineStyle: { color: D.GRID } } },
                // Achsenbeschriftung/-titel aus (zeigt stattdessen #yAxisOverlay, das beim
                // Scrollen sichtbar bleibt) — Gitterlinien (splitLine) bleiben wie gehabt.
                yAxis: { type: 'value', min: 0, max: D.yMax, axisLabel: { show: false }, axisLine: { show: false }, axisTick: { show: false }, splitLine: { show: D.showGrid, lineStyle: { color: D.GRID } } },
                tooltip: { trigger: 'axis', backgroundColor: D.TIP, borderColor: D.GRID, borderWidth: 1, textStyle: { color: D.TEXT, fontSize: fs(11) }, axisPointer: { type: 'line', lineStyle: { color: D.MUTED, type: 'dashed' } },
                    formatter: function (ps) {
                        if (!ps || !ps.length) { return ''; }
                        var x = ps[0].axisValue, di = Math.floor(x / 24 + 1e-6), hod = x - di * 24, hh = Math.floor(hod + 1e-6), mm = Math.round((hod - hh) * 60); if (mm >= 60) { hh++; mm -= 60; }
                        var head = cap((D.days[di] || D.days[0]).label) + ' ' + pad(hh) + ':' + pad(mm);
                        var html = '<div style="font-weight:500;margin-bottom:2px">' + head + '</div>', pvV = null, loV = null;
                        var kwhOf = function (v) { return D.bars ? ' <span style="color:' + D.MUTED + '">(' + (v * D.stH).toFixed(3) + ' kWh)</span>' : ''; };
                        ps.forEach(function (p) {
                            if (p.seriesName === 'PV Ist') { html += '<div><span style="color:' + D.pvMC + '">●</span> PV Ist: <b>' + p.value[1].toFixed(2) + ' kW</b>' + kwhOf(p.value[1]) + '</div>'; }
                            if (p.seriesName === 'Verbrauch Ist') { html += '<div><span style="color:' + D.loMC + '">●</span> Verbrauch Ist: <b>' + p.value[1].toFixed(2) + ' kW</b>' + kwhOf(p.value[1]) + '</div>'; }
                            if (p.seriesName === 'PV') {
                                // Kein P10/P90 bei PV (Dietmar, 26.08.2026): die PV-Prognose ist
                                // physikbasiert statt k-NN-Quantile wie bei der Last — echte
                                // Streuwerte gibt es dafür nicht, nur bei Verbrauch.
                                pvV = p.value[1];
                                html += '<div><span style="color:' + D.pvC + '">●</span> PV' + (D.bars ? ' Soll' : '') + ': <b>' + p.value[1].toFixed(2) + ' kW</b>' + kwhOf(p.value[1]) + '</div>';
                            }
                            if (p.seriesName === 'Verbrauch') {
                                loV = p.value[1]; var lb = nearestBand(D.loBand, p.value[0]);
                                html += '<div><span style="color:' + D.loC + '">●</span> Verbrauch' + (D.bars ? ' Soll' : '') + ': <b>' + p.value[1].toFixed(2) + ' kW</b>' + kwhOf(p.value[1]) + (lb ? ' <span style="color:' + D.MUTED + '">(P10–P90 ' + lb[1].toFixed(2) + '–' + lb[2].toFixed(2) + ' kW)</span>' : '') + '</div>';
                            }
                        });
                        if (pvV != null && loV != null) { var s = pvV - loV; html += '<div style="color:' + D.MUTED + ';margin-top:2px">Saldo ' + (s >= 0 ? '+' : '') + s.toFixed(2) + ' kW</div>'; }
                        return html;
                    } },
                series: series
            };

            if (!chart) { el.innerHTML = ''; chart = echarts.init(el, null, { renderer: 'canvas' }); }
            chart.resize({ width: D.renderW, height: canvasH });
            chart.setOption(option, true);
            updateScrollHint(D);
        }

        window.addEventListener('resize', function () {
            if (!chart && !(lastData && lastData.view === 'days')) { return; }
            // Volles render() statt nur resize()/reflow(): #scrollWrap-Breite hat sich
            // ggf. geändert, renderW (und damit Chart- und Tagesstreifen-Breite) müssen
            // neu berechnet werden, nicht nur der Inhalt in die alte Breite gezwängt.
            render();
        });
    </script>
</body>
